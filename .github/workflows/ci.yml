name: ci

on:
  push:
  pull_request:

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # plugin/client.js is a committed build artifact (git installs run no
      # build step), so CI must prove it still matches src/client/.
      - run: npm run check
      - run: node --check plugin/index.js
